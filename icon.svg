<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background gradient: deep ink red to rich burgundy -->
    <radialGradient id="bg" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#7a1a1a"/>
      <stop offset="100%" stop-color="#1a0505"/>
    </radialGradient>
    <!-- Gold shimmer gradient for strokes -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d06a"/>
      <stop offset="50%" stop-color="#c8960c"/>
      <stop offset="100%" stop-color="#f5d06a"/>
    </linearGradient>
    <!-- Inner glow for kanji -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Subtle paper texture via feTurbulence -->
    <filter id="paper" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>
    <!-- Clip to rounded square -->
    <clipPath id="rounded">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <!-- Base: rounded square background -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- Paper texture overlay (subtle) -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="#8b1a1a" opacity="0.08" filter="url(#paper)"/>

  <!-- Decorative border: double-line frame (traditional scroll style) -->
  <rect x="22" y="22" width="468" height="468" rx="90" ry="90" fill="none" stroke="url(#gold)" stroke-width="2.5" opacity="0.9"/>
  <rect x="32" y="32" width="448" height="448" rx="80" ry="80" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.45"/>

  <!-- Corner ornaments (top-left) -->
  <g opacity="0.7" stroke="url(#gold)" stroke-width="1.5" fill="none">
    <path d="M48 48 L80 48 L80 52 L52 52 L52 80 L48 80 Z"/>
    <path d="M464 48 L432 48 L432 52 L460 52 L460 80 L464 80 Z"/>
    <path d="M48 464 L80 464 L80 460 L52 460 L52 432 L48 432 Z"/>
    <path d="M464 464 L432 464 L432 460 L460 460 L460 432 L464 432 Z"/>
  </g>

  <!-- Horizontal rule lines (top and bottom decorative) -->
  <line x1="80" y1="120" x2="432" y2="120" stroke="url(#gold)" stroke-width="1" opacity="0.4"/>
  <line x1="100" y1="126" x2="412" y2="126" stroke="url(#gold)" stroke-width="0.5" opacity="0.25"/>
  <line x1="80" y1="392" x2="432" y2="392" stroke="url(#gold)" stroke-width="1" opacity="0.4"/>
  <line x1="100" y1="386" x2="412" y2="386" stroke="url(#gold)" stroke-width="0.5" opacity="0.25"/>

  <!-- Top label: 五十音 in small elegant kanji -->
  <text x="256" y="108" text-anchor="middle" font-family="'Hiragino Mincho ProN','Yu Mincho','MS Mincho',serif"
    font-size="36" font-weight="400" fill="url(#gold)" opacity="0.85" letter-spacing="8">五十音</text>

  <!-- Main central composition: large あ (hiragana) -->
  <text x="176" y="310" text-anchor="middle"
    font-family="'Hiragino Mincho ProN','Yu Mincho','MS Mincho',serif"
    font-size="210" font-weight="300" fill="#ffffff" opacity="0.97"
    filter="url(#glow)">あ</text>

  <!-- Overlapping ア (katakana) — offset right, smaller, red-tinted -->
  <text x="310" y="305" text-anchor="middle"
    font-family="'Hiragino Mincho ProN','Yu Mincho','MS Mincho',serif"
    font-size="130" font-weight="300" fill="#f5b8b8" opacity="0.55">ア</text>

  <!-- Bottom label: 道場 -->
  <text x="256" y="408" text-anchor="middle"
    font-family="'Hiragino Mincho ProN','Yu Mincho','MS Mincho',serif"
    font-size="38" font-weight="400" fill="url(#gold)" opacity="0.85" letter-spacing="14">道場</text>

  <!-- Tiny subtitle: romaji -->
  <text x="256" y="448" text-anchor="middle"
    font-family="Georgia,'Times New Roman',serif"
    font-size="18" font-weight="400" fill="#d4a0a0" opacity="0.6" letter-spacing="4">KANA DOJO</text>

  <!-- Decorative dot flourishes between labels and rules -->
  <circle cx="256" cy="138" r="2.5" fill="url(#gold)" opacity="0.6"/>
  <circle cx="226" cy="138" r="1.5" fill="url(#gold)" opacity="0.4"/>
  <circle cx="286" cy="138" r="1.5" fill="url(#gold)" opacity="0.4"/>
  <circle cx="256" cy="372" r="2.5" fill="url(#gold)" opacity="0.6"/>
  <circle cx="226" cy="372" r="1.5" fill="url(#gold)" opacity="0.4"/>
  <circle cx="286" cy="372" r="1.5" fill="url(#gold)" opacity="0.4"/>
</svg>
